# =====================================================================
# 클래스 정의 (단일 소스, Single Source of Truth)
# data.py / model.py / train.py / eval.py / infer_2d.py 는 모두 이 파일만 참조한다.
# 다른 곳에 클래스 이름/개수를 하드코딩하지 말 것.
# =====================================================================

# 원본 YOLO-seg 라벨의 class_id 와 동일하게 맞춤 (0=drill, 1=hammer, 2=clamp)
# -> CNN 학습 시 라벨을 별도로 리매핑할 필요가 없음
names:
  0: drill
  1: hammer
  2: clamp
  3: other

num_classes: 4
other_class_id: 3

# ---------------------------------------------------------------------
# "other" 클래스를 둔 이유
# ---------------------------------------------------------------------
# - 1단계 YOLO-Seg 는 class-agnostic(nc=1, "tool")로 학습되어 공구처럼 보이는
#   모든 영역을 검출하려고 하며, 배경/손/선반/그림자 등을 공구로 오검출하는
#   경우가 실제로 생긴다.
# - 2단계 CNN이 이런 오검출을 걸러내지 못하면 3D 모듈까지 잘못된 클래스의
#   포인트가 넘어가 다중 시점 투표를 오염시킨다.
# - 따라서 CNN 출력 클래스 수를 "실제 공구 3종 + other" 4종으로 두어,
#   YOLO가 박스를 쳤지만 실제로는 공구가 아닌 영역을 other로 분류해
#   3D 모듈 이전 단계에서 걸러내는 필터 역할을 하게 한다.
# - other 학습 샘플은 라벨 txt가 비어 있는(=배경만 있는) 프레임에서
#   랜덤 crop 하여 생성한다 (src/data.py 의 sample_other_crop 참고).
